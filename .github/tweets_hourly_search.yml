name: Twitter Hourly Search

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  twitter-search:
    runs-on: ubuntu-latest

    env:
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
      TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twitter-cli
        run: pip install twitter-cli

      - name: Run twitter search
        run: |
          mkdir -p output
          twitter search "stock market OR fed OR inflation OR gold OR crypto" \
            -n 50 \
            --json > output/tweets.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twitter-results
          path: output/tweets.json
