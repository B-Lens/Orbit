name: Modula

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Orbit repo
      - name: Checkout Orbit Repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3️⃣ Install Modula from npm
      - name: Install Modula
        run: npm install @pankajlabs/modula

      # 4️⃣ Run Analyze
      - name: Run Modula Analyze
        run: npx modula analyze
