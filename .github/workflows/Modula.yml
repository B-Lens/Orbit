name: Modula-MS

permissions:
  contents: read

on:
  workflow_dispatch:
  issues:
    types: [labeled]

jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'modula-task'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modula
        run: npm install @pankajlabs/modula

      - name: Run Modula Analyze
        run: |
          npx modula analyze src/orbit/market_intelligence

      - name: Upload GitNexus DB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-DB
          include-hidden-files: true
          path: src/orbit/market_intelligence/.gitnexus

      - name: Upload GitNexus Skill Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-output
          path: |
            src/orbit/market_intelligence/.claude
            src/orbit/market_intelligence/*.md
            
          
