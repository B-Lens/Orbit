name: AI Autonomous

on:
  issues:
    types: [labeled]

  workflow_dispatch:
    inputs:
      prompt:
        description: "Test prompt for aider"
        required: false
        default: "Create or update docs/market_sentiment_module_flowchart.md and open a PR labeled ai-autonomous."
      directory:
        description: "Directory where aider should run"
        required: false
        default: "."

jobs:
  aider-autonomous:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-autonomous'
    runs-on: ubuntu-latest
    environment:
      name: SECURITY_APPROVAL

    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Git user
        run: |
          git config --global user.name "ai-autonomous-bot"
          git config --global user.email "ai-bot@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install aider-install
          sudo apt-get update
          sudo apt-get install -y gh
          aider-install

      - name: Authenticate GitHub CLI
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Prepare prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          WORKFLOW_INPUT_PROMPT: ${{ inputs.prompt }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            echo "$ISSUE_TITLE" > issue.txt
            echo "" >> issue.txt
            echo "$ISSUE_BODY" >> issue.txt
          else
            echo "$WORKFLOW_INPUT_PROMPT" > issue.txt
          fi

          echo "Raw Issue is fetched successfully"

          cat <<EOF >> issue.txt
          Workflow:
          - create branch
          - implement changes
          - commit
          - push
          - create PR using gh
          - add label ai-autonomous
          - do not commit directly to main
          
          EOF

          echo "Issue formed: "
          cat issue.txt
            
      - name: Run Aider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_DIR: ${{ inputs.directory }}
        shell: bash
        run: |
          ISSUE_DATA=$(cat issue.txt)
          echo "Running aider in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          aider \
            --message-file issue.txt \
            --model o3-mini \
            --api-key openai=$OPENAI_API_KEY \
            --yes-always \
            --auto-commits \
            --no-pretty \
            --no-stream
