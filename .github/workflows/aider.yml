name: Aider Autonomous

on:
  issues:
    types: [labeled]

  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt for aider"
        required: false
        default: "Create or update docs/market_sentiment_module_flowchart.md"

jobs:
  aider-autonomous:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-autonomous'
    runs-on: ubuntu-latest

    environment:
      name: Aider-Autonomous

    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "ai-autonomous-bot"
          git config --global user.email "ai-bot@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install aider-install
          sudo apt-get update -qq
          sudo apt-get install -y -qq gh jq
          aider-install

      - name: Authenticate GitHub CLI
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Create working branch
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            BRANCH="ai/issue-${{ github.event.issue.number }}"
          else
            BRANCH="ai/manual-${{ github.run_id }}"
          fi

          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH"

      - name: Prepare AI prompt
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          WORKFLOW_PROMPT: ${{ inputs.prompt }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            echo "$ISSUE_TITLE" > issue.txt
            echo "" >> issue.txt
            echo "$ISSUE_BODY" >> issue.txt
          else
            echo "$WORKFLOW_PROMPT" > issue.txt
          fi

          cat <<EOF >> issue.txt

Instructions:
- Implement the requested change.
- Modify or create files if required.
- Commit the changes.
- Do not explain or propose a plan. Directly make the necessary file changes.
EOF

      - name: Run Aider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          aider \
            --message-file issue.txt \
            --model o3-mini \
            --api-key openai=$OPENAI_API_KEY \
            --yes-always \
            --auto-commits \
            --no-pretty \
            --no-stream \
            | tee aider.log

      - name: Upload AI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-autonomous-debug
          path: |
            issue.txt
            aider.log

      - name: Check for repository changes
        run: |
          git fetch origin main
          if git diff --quiet HEAD origin/main; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          else
            echo "NO_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Generate PR title and body
        if: env.NO_CHANGES == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git diff origin/main > diff.txt

          SUMMARY=$(curl https://api.openai.com/v1/chat/completions \
            -s \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "o3-mini",
              "messages": [
                {
                  "role": "system",
                  "content": "Summarize git diffs into a concise PR title and description."
                },
                {
                  "role": "user",
                  "content": "Summarize this diff. Return:\nTITLE: <title>\nBODY: <description>\n\n'"$(sed 's/"/\\"/g' diff.txt)"'"
                }
              ]
            }' | jq -r '.choices[0].message.content')

          TITLE=$(echo "$SUMMARY" | sed -n 's/^TITLE: //p')
          BODY=$(echo "$SUMMARY" | sed -n 's/^BODY: //p')

          if [ -z "$TITLE" ]; then
            TITLE="AI Autonomous Changes"
          fi

          if [ -n "$ISSUE_NUMBER" ]; then
            BODY="$BODY

Fixes #$ISSUE_NUMBER"
          fi

          echo "PR_TITLE=$TITLE" >> $GITHUB_ENV
          echo "PR_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Push branch
        if: env.NO_CHANGES == 'false'
        run: |
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: env.NO_CHANGES == 'false'
        run: |
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label ai-autonomous \
            --base main \
            --head "$BRANCH_NAME"

          PR_URL=$(gh pr view "$BRANCH_NAME" --json url -q .url)
          gh pr edit "$PR_URL" --add-reviewer ipankaj18

      - name: Skip PR if no changes
        if: env.NO_CHANGES == 'true'
        run: echo "No changes detected. Skipping PR creation."
