name: Aider Autonomous

on:
  issues:
    types: [labeled]

jobs:
  aider-autonomous:
    if: github.event_name == 'issues' && github.event.label.name == 'ai-autonomous'
    runs-on: ubuntu-latest

    environment:
      name: Aider-Autonomous

    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "ai-autonomous-bot"
          git config --global user.email "ai-bot@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install aider-install openai
          sudo apt-get update -qq
          sudo apt-get install -y -qq gh jq
          aider-install

      - name: Authenticate GitHub CLI
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Create working branch
        run: |  
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          # Convert issue title to URL-safe slug
          SLUG=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
            | cut -c1-40)

          BRANCH="issue-${ISSUE_NUMBER}/${SLUG}"
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH"

      - name: Prepare AI prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "$ISSUE_TITLE" > issue.txt
          echo "\n" >> issue.txt
          echo "$ISSUE_BODY" >> issue.txt
          cat <<EOF >> issue.txt

          Instructions:
          - Implement the requested change.
          - Modify or create files if required.
          - Commit the changes.
          - Do not explain or propose a plan. Directly make the necessary file changes.
          EOF

      - name: Repo Map
        continue-on-error: true
        run: |
          aider --show-repo-map --exit --yes > aider_repo_map.txt

      - name: Run Aider
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          aider \
            --message-file issue.txt \
            --model openrouter/anthropic/claude-sonnet-4.6  \
            --yes-always \
            --auto-commits \
            --no-pretty \
            --no-stream \
            | tee aider.log

      - name: Save git diff
        run: |
          git diff > aider_changes.diff || true

      - name: Save patch
        run: |
          git format-patch origin/main --stdout > aider_changes.patch || true

      - name: Check for repository changes
        run: |
          git fetch origin main
          if git diff --quiet HEAD origin/main; then
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          else
            echo "NO_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Generate PR title and body
        if: env.NO_CHANGES == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python .github/scripts/generate_pr_summary.py

      - name: Push branch
        if: env.NO_CHANGES == 'false'
        run: |
          git push --set-upstream origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: env.NO_CHANGES == 'false'
        run: |
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label ai-autonomous \
            --base main \
            --head "$BRANCH_NAME"

          PR_URL=$(gh pr view "$BRANCH_NAME" --json url -q .url)
          gh pr edit "$PR_URL" --add-reviewer ipankaj18

      - name: Skip PR if no changes
        if: env.NO_CHANGES == 'true'
        run: echo "No changes detected. Skipping PR creation."

      - name: Upload AI artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-autonomous-debug
          path: |
            issue.txt
            aider.log
            aider_changes.diff
            aider_changes.patch
            aider_repo_map.txt
