name: Codex Automation

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  codex:
    uses: ipankaj18/code-kit/.github/workflows/codex-automation.yml@056867a00859225c4c1c36ed05b4b7637bbf07fe
    with:
      reviewer: ipankaj18
      extra_instructions: >-
        Preserve live/Testnet trading safety boundaries. Add or update focused
        tests and documentation when behavior changes.
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
