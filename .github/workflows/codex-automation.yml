name: Codex Automation

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  codex:
    uses: b-lens/code-kit/.github/workflows/codex-automation.yml@main
    with:
      reviewer: B-Lens
      extra_instructions: >-
        Preserve live/Testnet trading safety boundaries. Add or update focused
        tests and documentation when behavior changes.
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
