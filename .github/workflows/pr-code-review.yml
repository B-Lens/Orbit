name: Codex Strict Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Pin the reusable workflow revision that loads policy from the PR base commit.
    uses: b-lens/code-kit/.github/workflows/pr-code-review.yml@08ac4766f62e4e5a0ac8d11e7c996d713033d360
    with:
      review_prompt_path: .github/codex/prompt-review.md
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      ANTIGRAVITY_OAUTH_TOKEN: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN }}
