name: Codex Strict Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Pin the reusable workflow revision that loads policy from the PR base commit.
    uses: ipankaj18/code-kit/.github/workflows/pr-code-review.yml@a2732fe8a4203497f32ebc5d60476180b7f4f774
    with:
      review_prompt_path: .github/codex/prompt-review.md
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      ANTIGRAVITY_OAUTH_TOKEN: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN }}
