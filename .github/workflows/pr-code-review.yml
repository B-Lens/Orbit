name: Codex Strict Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: ipankaj18/code-kit/.github/workflows/pr-code-review.yml@6e0369a34466e2b33ccd130eb81d8bb0233574d8
    with:
      review_prompt: >-
        Review this pull request as a strict production-safety gate for a
        continuously running automated cryptocurrency trading system. Inspect the
        complete diff and enough surrounding code to prove each finding. Focus only
        on actionable correctness, security, data-integrity, trading-risk, and
        deployment defects introduced by the diff. Preserve paper/Testnet/live
        environment separation. Ignore style, documentation preferences,
        speculative concerns, and pre-existing issues outside the diff.
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
