name: Update Supermemory

on:
  push:  # because if condition is required for PR merge
    branches:
      - main
jobs:
  update-memory:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install deps
        run: |
          pip install supermemory==3.4.0 openai

      - name: Update supermemory
        run: python .github/scripts/update_supermemory.py
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}
          MODEL_TOKEN: ${{ secrets.MODEL_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
