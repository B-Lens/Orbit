[mypy]
# Enable strict type checking — good for catching bugs early
strict = True

# Ignore missing type hints in third-party libraries like mplfinance, pandas, etc.
ignore_missing_imports = True

# Show error codes (helpful to see which kind of issue you're dealing with)
show_error_codes = True

# Optional: Exclude certain folders from being type-checked
exclude = ^(build|dist|venv|.venv|tests/data)/

# Optional: Use incremental type checking cache for faster checks
incremental = True
